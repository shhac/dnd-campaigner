<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectator Mode</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <span class="header-icon">◆</span>
      <h1 id="campaign-title">Spectator Mode</h1>
    </div>
    <div class="header-center" id="filter-toggles"></div>
    <div class="header-right">
      <span id="session-status" class="status-badge starting">Starting</span>
      <span id="event-count" class="event-count">0 events</span>
      <button id="scroll-lock" class="btn-icon" title="Auto-scroll">⬇</button>
    </div>
  </header>

  <main>
    <aside id="party-panel">
      <h2>Party</h2>
      <div id="agent-cards"></div>
    </aside>

    <section id="play-script">
      <div id="events-container"></div>
    </section>

    <aside id="flow-panel">
      <h2>Message Flow</h2>
      <div id="flow-log"></div>
    </aside>
  </main>

  <footer id="player-bar">
    <div id="prompt-container" class="hidden">
      <div id="prompt-header">
        <span id="prompt-label">GM asks:</span>
        <span id="prompt-countdown"></span>
      </div>
      <div id="prompt-text"></div>
      <div id="prompt-input-row">
        <input type="text" id="prompt-input" placeholder="Type your response..." autocomplete="off" />
        <button id="prompt-send" class="player-btn primary">Send</button>
        <button id="prompt-skip" class="player-btn">Skip</button>
      </div>
    </div>
    <div id="interrupt-container" class="hidden">
      <div id="interrupt-input-row">
        <input type="text" id="interrupt-input" placeholder="What do you want to say?" autocomplete="off" />
        <button id="interrupt-send" class="player-btn primary">Send</button>
        <button id="interrupt-cancel" class="player-btn">Cancel</button>
      </div>
    </div>
    <div id="player-controls">
      <button id="btn-interrupt" class="player-btn" title="Speak up">Interrupt</button>
      <button id="btn-pause" class="player-btn" title="Pause session">Pause</button>
      <button id="btn-mode" class="player-btn" title="Toggle AI control">Human</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
